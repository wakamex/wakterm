name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  verify-tag:
    name: Verify release tag and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an annotated tag matching VERSION and committed release notes
        uses: wakamex/release-actions/verify-release-tag@stable
        with:
          version-command: cat VERSION

  build:
    name: ${{ matrix.name }}
    needs:
      - validate
      - verify-tag
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu
            name: ubuntu-24.04
            runs_on: ubuntu-24.04
            artifact_name: release-ubuntu
            artifact_glob: |
              wakterm-*.deb
              wakterm-*.xz
          - id: macos
            name: macos-15
            runs_on: macos-15
            artifact_name: release-macos
            artifact_glob: |
              wakterm-*.zip
          - id: windows
            name: windows-2025
            runs_on: windows-2025
            artifact_name: release-windows
            artifact_glob: |
              wakterm-*.zip
              wakterm-*.exe

    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record release tag
        shell: bash
        run: printf '%s\n' "${TAG_NAME}" > .tag

      - name: Install Rust
        if: matrix.id != 'windows'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Rust
        if: matrix.id == 'windows'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Linux system deps
        if: matrix.id == 'ubuntu'
        run: |
          sudo apt-get update
          env CI=yes ./get-deps --testing

      - name: Install macOS targets
        if: matrix.id == 'macos'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build and package on Ubuntu
        if: matrix.id == 'ubuntu'
        shell: bash
        run: |
          cargo build --release --locked \
            -p wakterm \
            -p wakterm-gui \
            -p wakterm-mux-server \
            -p strip-ansi-escapes
          bash ci/deploy.sh

      - name: Build and package on macOS
        if: matrix.id == 'macos'
        shell: bash
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --target "$target" --release --locked \
              -p wakterm \
              -p wakterm-gui \
              -p wakterm-mux-server \
              -p strip-ansi-escapes
          done
          bash ci/deploy.sh

      - name: Build on Windows
        if: matrix.id == 'windows'
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release --locked -p wakterm -p wakterm-gui -p wakterm-mux-server -p strip-ansi-escapes

      - name: Package Windows artifacts
        if: matrix.id == 'windows'
        shell: bash
        run: bash ci/deploy.sh

      - name: Upload target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  build-fedora:
    name: fedora-43
    needs:
      - validate
      - verify-tag
    runs-on: ubuntu-24.04
    container: fedora:43

    env:
      CARGO_INCREMENTAL: "0"
      TAG_NAME: ${{ github.ref_name }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install container prerequisites
        run: dnf install -y ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record release tag
        run: printf '%s\n' "${TAG_NAME}" > .tag

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Linux system deps
        run: env CI=yes ./get-deps --testing

      - name: Build and package
        run: |
          cargo build --release --locked \
            -p wakterm \
            -p wakterm-gui \
            -p wakterm-mux-server \
            -p strip-ansi-escapes
          bash ci/deploy.sh

      - name: Upload Fedora artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-fedora
          path: wakterm-*.rpm
          if-no-files-found: error

  stage:
    name: Stage release assets
    needs:
      - build
      - build-fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Upload combined release-assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    needs: stage
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: wakamex/release-actions/.github/workflows/binary-release.yml@stable
    with:
      artifact: release-assets
