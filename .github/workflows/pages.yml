name: cloudflare-pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/fonts/SymbolsNerdFontMono-Regular.ttf"
      - "assets/icon/terminal.png"
      - "assets/icon/wakterm-icon.png"
      - "ci/build-docs.sh"
      - "ci/build-zola-docs.py"
      - "ci/generate-docs.py"
      - "ci/install-zola.sh"
      - "ci/subst-release-info.py"
      - "docs-site/**"
      - "wrangler.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.repository == 'wakamex/wakterm'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install gelatyx
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: gelatyx
          version: "0.3.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ github.ref }}
          path: .cache
      - name: Build docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source $HOME/.cargo/env
          ./ci/build-docs.sh
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c48ce23cb4423feb34a7fe3921e307f"
          # Passed through the environment: pasting the message into the
          # script would let its quotes and other shell syntax take effect.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          npx wrangler@4.69.0 pages deploy gh_pages \
            --project-name wakterm \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
