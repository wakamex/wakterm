name: termwiz

on:
  pull_request:
    branches:
      - main
    paths:
      - "termwiz/**"
      - "bidi/**"
      - "wakterm-dynamic/**"
      - "color-types/**"
      - "filedescriptor/**"
      - "vtparse/**"
      - ".github/workflows/termwiz.yml"
  push:
    branches:
      - main
    paths:
      - "termwiz/**"
      - "bidi/**"
      - "wakterm-dynamic/**"
      - "color-types/**"
      - "filedescriptor/**"
      - "vtparse/**"
      - ".github/workflows/termwiz.yml"

jobs:
  build-termwiz-all-features:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: "Cache cargo"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            termwiz
          key: "termwiz-${{ runner.os }}"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: "cargo-nextest"
      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build -p termwiz --all-features
          cargo nextest run --no-fail-fast --package termwiz --all-features
