name: verify-pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "ci/build-docs.sh"
      - "ci/build-zola-docs.py"
      - "ci/generate-docs.py"
      - "ci/install-zola.sh"
      - "ci/subst-release-info.py"
      - "docs-site/**"
      - ".github/workflows/verify-pages.yml"

jobs:
  build-docs:
    env:
      BUILD_REASON: "PR"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install gelatyx
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: gelatyx
          version: "0.3.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ github.ref }}
          path: .cache
      - name: Build
        run: ./ci/build-docs.sh
