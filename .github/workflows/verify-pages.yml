name: verify-pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "ci/build-docs.sh"
      - "ci/build-zola-docs.py"
      - "ci/generate-docs.py"
      - "ci/install-zola.sh"
      - "ci/subst-release-info.py"
      - "docs-site/**"
      - ".github/workflows/verify-pages.yml"

jobs:
  build-docs:
    env:
      BUILD_REASON: "PR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: Install gelatyx
        uses: baptiste0928/cargo-install@v3
        with:
          crate: gelatyx
          version: "0.3.0"
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/cache@v5
        with:
          key: ${{ github.ref }}
          path: .cache
      - name: Build
        run: ./ci/build-docs.sh
